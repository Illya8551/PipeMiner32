; =============================================================================
;  PipeMiner32 - pipelined hardware SHA-256d miner for the classic ESP32 (DevKit V1)
; =============================================================================
[env:esp32doit-devkit-v1]
; Pinned on purpose: Arduino-ESP32 2.0.x (ESP-IDF 4.4) -> the register / header
; names used in hwsha.h are known to exist there.
platform  = espressif32@6.5.0
board     = esp32doit-devkit-v1
framework = arduino

board_build.f_cpu       = 240000000L
board_build.flash_mode  = qio
board_build.f_flash     = 80000000L
monitor_speed           = 115200
upload_speed            = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; -O3 for our code (Arduino default is -Os). The hot loops are written so that
; GCC keeps all working variables in registers.
build_unflags = -Os -O2
build_flags =
    -O3
    -fno-stack-protector
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
